<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>요즘것들연구소</title>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-GFNEPQTGGS"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');

  :root {
    --bg: #0b0e27;
    --bg-soft: #10142f;
    --card: rgba(255,255,255,0.04);
    --card-border: rgba(255,255,255,0.08);
    --text: #e9e9f5;
    --text-dim: #9a9ab4;
    --accent-1: #8b5cf6;
    --accent-2: #ff4fa3;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  }

  a { color: inherit; text-decoration: none; }

  .topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 12px;
    padding: 18px 20px;
    background: rgba(11,14,39,0.9);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--card-border);
  }
  .topbar .brand { font-weight: 700; font-size: 16px; }

  main { max-width: 720px; margin: 0 auto; padding: 24px 20px 80px; }

  .hero {
    padding: 8px 0 20px;
  }
  .hero h1 {
    font-size: 22px; font-weight: 900; margin: 0 0 6px; letter-spacing: -0.01em;
  }
  .hero p { color: var(--text-dim); font-size: 14px; margin: 0; }

  .category-bar {
    display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 12px;
    scrollbar-width: none;
  }
  .category-bar:last-of-type { padding-bottom: 20px; }
  .category-bar::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0;
    padding: 8px 16px; border-radius: 999px;
    font-size: 13px; font-weight: 500;
    border: 1px solid var(--card-border);
    background: var(--card);
    color: var(--text-dim);
    cursor: pointer;
    transition: all .15s ease;
  }
  .chip.active {
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    color: #fff; border-color: transparent;
  }

  section.banners { display: flex; flex-direction: column; gap: 12px; margin-bottom: 28px; }
  .banner-card {
    display: block;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid var(--card-border);
    background: var(--card);
    position: relative;
  }
  .banner-card img { width: 100%; display: block; aspect-ratio: 16/7; object-fit: cover; }
  .banner-card .banner-text {
    padding: 16px;
  }
  .banner-card .banner-text h3 { margin: 0 0 4px; font-size: 16px; }
  .banner-card .banner-text p { margin: 0; color: var(--text-dim); font-size: 13px; }

  .product-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }
  .product-card {
    display: flex; flex-direction: column;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid var(--card-border);
    background: var(--card);
  }
  .product-card .thumb {
    position: relative;
    width: 100%; aspect-ratio: 4/3;
    background: var(--bg-soft);
    display: flex; align-items: center; justify-content: center;
  }
  .featured-badge {
    position: absolute; top: 8px; left: 8px;
    padding: 4px 10px; border-radius: 999px;
    font-size: 11px; font-weight: 700; color: #fff;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
  }
  .product-card .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .product-card .body { padding: 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .product-card .name { font-size: 14px; font-weight: 700; line-height: 1.35; }
  .product-card .desc {
    font-size: 12.5px; color: var(--text-dim); line-height: 1.4;
    flex: 1;
  }
  .product-card .go-btn {
    margin-top: 4px;
    display: block; text-align: center;
    padding: 9px 0; border-radius: 10px;
    font-size: 13px; font-weight: 700;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    color: #fff;
  }

  .empty-note {
    color: var(--text-dim); font-size: 13.5px; text-align: center; padding: 40px 0;
  }

  .search-bar { margin-bottom: 14px; position: relative; }
  .search-bar input {
    width: 100%; padding: 12px 16px 12px 40px; border-radius: 12px;
    border: 1px solid var(--card-border); background: var(--card);
    color: var(--text); font-size: 14px; font-family: inherit;
  }
  .search-bar input::placeholder { color: var(--text-dim); }
  .search-bar input:focus { outline: none; border-color: var(--accent-1); }
  .search-bar svg {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    pointer-events: none;
  }

  .pagination { display: flex; justify-content: center; align-items: center; gap: 6px; margin-top: 24px; flex-wrap: wrap; }
  .pagination button {
    min-width: 34px; height: 34px; border-radius: 8px;
    border: 1px solid var(--card-border); background: var(--card);
    color: var(--text-dim); font-size: 13px; font-weight: 600; cursor: pointer;
    font-family: inherit;
  }
  .pagination button.active {
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    color: #fff; border-color: transparent;
  }
  .pagination button:disabled { opacity: .35; cursor: default; }

  footer {
    max-width: 720px; margin: 0 auto; padding: 24px 20px 48px;
    color: var(--text-dim); font-size: 12.5px; line-height: 1.6;
    border-top: 1px solid var(--card-border);
  }
</style>
</head>
<body>

<div class="topbar">
  <svg width="22" height="25" viewBox="0 0 200 230">
    <defs>
      <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="20" y1="10" x2="180" y2="220">
        <stop offset="0%" stop-color="#8B5CF6"/>
        <stop offset="100%" stop-color="#FF4FA3"/>
      </linearGradient>
    </defs>
    <rect x="82" y="10" width="36" height="64" rx="8" fill="url(#g)"/>
    <path d="M82,70 L118,70 L155,158 L45,158 Z" fill="url(#g)"/>
    <rect x="25" y="150" width="150" height="70" rx="30" fill="url(#g)"/>
    <rect x="45" y="140" width="110" height="8" rx="4" fill="#ffffff" opacity="0.85"/>
    <polygon points="140,0 144.95,17.05 162,22 144.95,26.95 140,44 135.05,26.95 118,22 135.05,17.05" fill="#ffffff"/>
  </svg>
  <span class="brand">요즘것들연구소</span>
</div>

<main>
  <div class="hero">
    <h1>요즘 이슈, 요즘 아이템</h1>
    <p>매일 업데이트되는 트렌드 큐레이션 상품</p>
  </div>

  <div class="search-bar">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9a9ab4" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input type="search" id="searchInput" placeholder="상품 검색 (예: 이어폰, 청소기)">
  </div>

  <div class="category-bar" id="platformBar"></div>
  <div class="category-bar" id="categoryBar"></div>

  <section class="banners" id="bannerSection"></section>

  <div class="product-grid" id="productGrid"></div>
  <div class="empty-note" id="emptyNote" hidden>지금 소개할 상품을 준비 중이에요.</div>
  <div class="pagination" id="pagination"></div>
</main>

<footer>

</footer>

</body>
</html>
